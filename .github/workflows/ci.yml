name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: donjons
          POSTGRES_PASSWORD: donjons
          POSTGRES_DB: guilde
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U donjons -d guilde"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_URL: jdbc:postgresql://localhost:5432/guilde
      DB_USER: donjons
      DB_PASSWORD: donjons

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Apply database schema
        env:
          PGPASSWORD: donjons
        run: psql -h localhost -U donjons -d guilde -f resources/init.sql

      - name: Build
        run: mvn -B clean compile

      - name: Tests
        run: mvn -B test
